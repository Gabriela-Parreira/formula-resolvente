<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Fórmula Resolvente</title>
</head>
<body>
  <script>
    let a;
    let repetir;

    do {
      a = Number(prompt("Valor de a:"));

      while (a === 0 || Number.isNaN(a)) {
        alert("O valor de 'a' não pode ser zero!");
        a = Number(prompt("Introduz novamente o valor de a:"));
      }

      let b = Number(prompt("Valor de b:"));
      let c = Number(prompt("Valor de c:"));
      let delta = b * b - 4 * a * c;

      if (delta >= 0) {
        let x1 = (-b + Math.sqrt(delta)) / (2 * a);
        let x2 = (-b - Math.sqrt(delta)) / (2 * a);

        let x1Arred = x1.toFixed(2);
        let x2Arred = x2.toFixed(2);

        alert("x1 = " + x1Arred + " e x2 = " + x2Arred);
      } else {
        alert("Não existem raízes reais.");
      }

      repetir = confirm("Deseja calcular outra equação?");
    } while (repetir);
  </script>
</body>
</html>
